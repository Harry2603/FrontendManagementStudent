<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#0f0f1a" />
    </radialGradient>

    <!-- Glowing Avatar Gradient -->
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #e879f9; #38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e; #fb7185; #38bdf8; #818cf8; #f43f5e" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Avatar Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    
    /* Floating &amp; Pulse Animation for Avatar Group */
    .avatar-group {
      animation: float 4s ease-in-out infinite;
      transform-origin: center;
    }

    .avatar-ring {
      animation: pulse 2.5s ease-in-out infinite alternate;
      transform-origin: 400px 160px;
    }

    /* Text Animation */
    .animated-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 1px;
      fill: url(#text-grad);
      text-anchor: middle;
      filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));
    }

    /* Background Particles Floating */
    .particle {
      fill: #ffffff;
      opacity: 0.2;
      animation: float-particle 6s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes float-particle {
      0% { transform: translateY(0px) scale(1); opacity: 0.1; }
      50% { transform: translateY(-20px) scale(1.3); opacity: 0.4; }
      100% { transform: translateY(0px) scale(1); opacity: 0.1; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="450" class="bg" rx="20" />

  <!-- Ambient Decorative Particles -->
  <circle cx="150" cy="120" r="4" class="particle" style="animation-delay: 0s;" />
  <circle cx="680" cy="180" r="6" class="particle" style="animation-delay: 1s;" />
  <circle cx="200" cy="340" r="5" class="particle" style="animation-delay: 2s;" />
  <circle cx="620" cy="360" r="3" class="particle" style="animation-delay: 1.5s;" />

  <!-- Avatar Container Group -->
  <g class="avatar-group">
    <!-- Glowing Outer Ring -->
    <circle cx="400" cy="160" r="68" fill="none" stroke="url(#avatar-grad)" stroke-width="4" filter="url(#glow)" class="avatar-ring" />
    
    <!-- Avatar Background Circle -->
    <circle cx="400" cy="160" r="60" fill="#2d2d48" stroke="url(#avatar-grad)" stroke-width="3" filter="url(#shadow)" />

    <!-- Default User Icon (Head & Body Clip) -->
    <g id="user-icon">
      <clipPath id="avatar-clip">
        <circle cx="400" cy="160" r="58" />
      </clipPath>

      <g clip-path="url(#avatar-clip)">
        <!-- Head -->
        <circle cx="400" cy="145" r="22" fill="#e2e8f0" />
        <!-- Body/Shoulders -->
        <path d="M 400 178 C 365 178, 342 200, 342 225 L 458 225 C 458 200, 435 178, 400 178 Z" fill="#e2e8f0" />
      </g>
    </g>
  </g>

  <!-- Animated Greeting Text -->
  <text x="400" y="310" class="animated-text">
    Welcome back
  </text>
</svg>